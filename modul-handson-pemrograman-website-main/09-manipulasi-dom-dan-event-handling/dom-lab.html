<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi DOM &amp; Daftar Mahasiswa Dinamis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 4px;
        }
    </style>
</head>
<body class="bg-light p-5">

    <div class="container" style="max-width: 800px;">
        <div class="row g-4">
            
            <!-- Kolom Form Input -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h2 class="h5 mb-0">Input Data Mahasiswa</h2>
                    </div>
                    <div class="card-body">
                        <form id="studentForm">
                            <div class="mb-3">
                                <label for="nim" class="form-label">NIM (10 Digit)</label>
                                <input type="text" class="form-control" id="nim" required>
                                <div id="nimError" class="error-message"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="name" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="name" required>
                                <div id="nameError" class="error-message"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Tambah Mahasiswa</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Kolom Tabel Tampilan -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h2 class="h5 mb-0">Daftar Mahasiswa Terdaftar</h2>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered table-striped">
                            <thead>
                                <tr>
                                    <th>NIM</th>
                                    <th>Nama</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody">
                                <!-- Baris data akan dimasukkan secara dinamis di sini -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Hubungkan skrip interaktivitas -->
    <script src="./dom-app.js"></script>
</body>
</html>
