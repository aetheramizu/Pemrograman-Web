<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Akademik Modern</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* CSS Variables untuk sistem tema dinamis */
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --transition-speed: 0.4s;
        }

        /* Kelas modifikasi tema gelap */
        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            font-family: sans-serif;
        }

        .dashboard-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(0,0,0,0.1);
            transition: background-color var(--transition-speed);
        }

        body.dark-theme .table {
            color: #e0e0e0;
            border-color: #444;
        }
    </style>
</head>
<body class="p-5">

    <div class="container" style="max-width: 900px;">
        
        <!-- Header dengan Tombol Toggle Tema -->
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3">Dasbor Nilai Kuliah</h1>
            <button id="themeToggleBtn" class="btn btn-outline-secondary">Ubah Tema</button>
        </header>

        <!-- Dasbor Konten Card -->
        <main class="card p-4 dashboard-card shadow-sm">
            <div class="row g-3 mb-3">
                <div class="col-sm-8">
                    <input type="text" id="searchInput" class="form-control" placeholder="Ketik nama mahasiswa untuk memfilter...">
                </div>
                <div class="col-sm-4">
                    <span id="pageIndicator" class="form-control-plaintext text-end font-weight-bold"></span>
                </div>
            </div>

            <!-- Tabel Data -->
            <table class="table table-striped table-hover mt-2">
                <thead>
                    <tr>
                        <th>NIM</th>
                        <th>Nama Lengkap</th>
                        <th>Nilai Angka</th>
                        <th>Predikat</th>
                    </tr>
                </thead>
                <tbody id="gradesTableBody">
                    <!-- Data dimuat secara dinamis -->
                </tbody>
            </table>

            <!-- Navigasi Paginasi (BOM hash controlled) -->
            <nav class="d-flex justify-content-between align-items-center mt-3">
                <button id="prevBtn" class="btn btn-primary btn-sm">Sebelumnya</button>
                <button id="nextBtn" class="btn btn-primary btn-sm">Selanjutnya</button>
            </nav>
        </main>
    </div>

    <script src="./advanced-app.js"></script>
</body>
</html>
