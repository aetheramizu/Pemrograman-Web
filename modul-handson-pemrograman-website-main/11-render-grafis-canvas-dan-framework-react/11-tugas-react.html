<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Mandiri: Pencatat Transaksi Keuangan Mahasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Memuat Pustaka React & Babel Transpiler via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-light p-4 p-md-5">

    <div id="root">
        <!-- Root Container React -->
    </div>

    <script type="text/babel">
        "use strict";

        const { useState } = React;

        // 1. Sub-Komponen: Form Input Transaksi Baru (Controlled Component)
        function TransactionForm({ onAddTransaction }) {
            const [deskripsi, setDeskripsi] = useState("");
            const [jenis, setJenis] = useState("PENGELUARAN");
            const [nominal, setNominal] = useState("");

            const handleSubmit = (e) => {
                e.preventDefault();
                const numericNominal = parseFloat(nominal);
                if (!deskripsi.trim() || isNaN(numericNominal) || numericNominal <= 0) {
                    alert("Harap masukkan deskripsi dan nominal transaksi yang valid!");
                    return;
                }

                const newTransaction = {
                    id: Date.now(),
                    deskripsi_transaksi: deskripsi,
                    jenis: jenis,
                    nominal: numericNominal
                };

                onAddTransaction(newTransaction);
                setDeskripsi("");
                setNominal("");
            };

            return (
                <form onSubmit={handleSubmit} className="card card-body bg-white border mb-4 shadow-sm">
                    <h2 className="h6 fw-bold mb-3 text-secondary">Tambah Transaksi Baru</h2>
                    <div className="row g-3">
                        <div className="col-md-5">
                            <input
                                type="text"
                                className="form-control"
                                placeholder="Deskripsi transaksi (contoh: Beli Buku)"
                                value={deskripsi}
                                onChange={(e) => setDeskripsi(e.target.value)}
                                required
                            />
                        </div>
                        <div className="col-md-3">
                            <select
                                className="form-select"
                                value={jenis}
                                onChange={(e) => setJenis(e.target.value)}
                            >
                                <option value="PEMASUKAN">Pemasukan (+)</option>
                                <option value="PENGELUARAN">Pengeluaran (-)</option>
                            </select>
                        </div>
                        <div className="col-md-2">
                            <input
                                type="number"
                                className="form-control"
                                placeholder="Nominal (Rp)"
                                value={nominal}
                                onChange={(e) => setNominal(e.target.value)}
                                min="1"
                                required
                            />
                        </div>
                        <div className="col-md-2">
                            <button type="submit" className="btn btn-primary w-100 fw-semibold">
                                Simpan
                            </button>
                        </div>
                    </div>
                </form>
            );
        }

        // 2. Sub-Komponen: Tabel Riwayat Transaksi (List Component)
        function TransactionList({ transactions, onDeleteTransaction }) {
            const formatRupiah = (number) => {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
            };

            return (
                <div className="table-responsive mb-4">
                    <table className="table table-hover table-bordered align-middle bg-white shadow-sm">
                        <thead className="table-dark">
                            <tr>
                                <th>Deskripsi</th>
                                <th>Jenis</th>
                                <th>Nominal</th>
                                <th className="text-center" style={{ width: "100px" }}>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            {transactions.length === 0 ? (
                                <tr>
                                    <td colSpan="4" className="text-center text-muted py-4">
                                        Belum ada riwayat transaksi recorded.
                                    </td>
                                </tr>
                            ) : (
                                transactions.map((t) => (
                                    <tr key={t.id}>
                                        <td className="fw-medium">{t.deskripsi_transaksi}</td>
                                        <td>
                                            <span className={`badge ${t.jenis === 'PEMASUKAN' ? 'bg-success' : 'bg-warning text-dark'}`}>
                                                {t.jenis}
                                            </span>
                                        </td>
                                        <td className={t.jenis === 'PEMASUKAN' ? 'text-success fw-bold' : 'text-danger fw-bold'}>
                                            {t.jenis === 'PEMASUKAN' ? '+' : '-'} {formatRupiah(t.nominal)}
                                        </td>
                                        <td className="text-center">
                                            <button
                                                className="btn btn-outline-danger btn-sm"
                                                onClick={() => onDeleteTransaction(t.id)}
                                            >
                                                Hapus
                                            </button>
                                        </td>
                                    </tr>
                                ))
                            )}
                        </tbody>
                    </table>
                </div>
            );
        }

        // 3. Sub-Komponen: Rangkuman Statistik Keuangan (Summary Component)
        function TransactionSummary({ transactions }) {
            // Kalkulasi total pemasukan & pengeluaran menggunakan array reduce
            const totalPemasukan = transactions
                .filter(t => t.jenis === 'PEMASUKAN')
                .reduce((acc, t) => acc + t.nominal, 0);

            const totalPengeluaran = transactions
                .filter(t => t.jenis === 'PENGELUARAN')
                .reduce((acc, t) => acc + t.nominal, 0);

            const saldoSisa = totalPemasukan - totalPengeluaran;

            const formatRupiah = (number) => {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
            };

            return (
                <div className="row g-3">
                    <div className="col-md-4">
                        <div className="p-3 bg-white rounded border border-success border-2 shadow-sm text-center">
                            <span className="d-block text-muted small fw-semibold">Total Pemasukan</span>
                            <span className="h5 text-success fw-bold">{formatRupiah(totalPemasukan)}</span>
                        </div>
                    </div>
                    <div className="col-md-4">
                        <div className="p-3 bg-white rounded border border-warning border-2 shadow-sm text-center">
                            <span className="d-block text-muted small fw-semibold">Total Pengeluaran</span>
                            <span className="h5 text-warning text-dark fw-bold">{formatRupiah(totalPengeluaran)}</span>
                        </div>
                    </div>
                    <div className="col-md-4">
                        <div className={`p-3 rounded border border-2 shadow-sm text-center text-white ${saldoSisa >= 0 ? 'bg-primary border-primary' : 'bg-danger border-danger'}`}>
                            <span className="d-block text-white-50 small fw-semibold">Saldo Sisa Uang Saku</span>
                            <span className="h5 fw-bold">{formatRupiah(saldoSisa)}</span>
                        </div>
                    </div>
                </div>
            );
        }

        // 4. Komponen Utama Pengendali Aplikasi (Root Component)
        function App() {
            // State utama transaksi uang saku
            const [transactions, setTransactions] = useState([
                { id: 1, deskripsi_transaksi: "Uang Saku Bulanan Orang Tua", jenis: "PEMASUKAN", nominal: 1500000 },
                { id: 2, deskripsi_transaksi: "Beli Buku Modul Pemrograman", jenis: "PENGELUARAN", nominal: 120000 },
                { id: 3, deskripsi_transaksi: "Langganan Internet & Cloud", jenis: "PENGELUARAN", nominal: 150000 }
            ]);

            const handleAddTransaction = (newTx) => {
                // Modifikasi state secara immutable menggunakan spread operator
                setTransactions([...transactions, newTx]);
            };

            const handleDeleteTransaction = (idToDelete) => {
                // Filtering immutable array
                setTransactions(transactions.filter(t => t.id !== idToDelete));
            };

            return (
                <div className="container" style={{ maxWidth: "800px" }}>
                    <div className="card shadow border-0 overflow-hidden">
                        <div className="card-header bg-dark text-white text-center py-3">
                            <h1 className="h4 mb-1 fw-bold">Sistem Pencatat Keuangan Mahasiswa</h1>
                            <p className="small text-light mb-0">Implementasi Component, Props, & State React JS</p>
                        </div>
                        <div className="card-body p-4 bg-light">
                            <TransactionForm onAddTransaction={handleAddTransaction} />
                            
                            <h2 className="h6 fw-bold mb-3 text-secondary border-bottom pb-2">Riwayat Transaksi</h2>
                            <TransactionList transactions={transactions} onDeleteTransaction={handleDeleteTransaction} />

                            <h2 className="h6 fw-bold my-3 text-secondary border-bottom pb-2">Rangkuman Saldo & Statistik</h2>
                            <TransactionSummary transactions={transactions} />
                        </div>
                    </div>
                </div>
            );
        }

        // 5. Render Aplikasi React ke Root Element
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
