<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Katalog media interaktif perkuliahan Teknik Informatika.">
    <title>Galeri Pembelajaran Interaktif</title>
    <!-- Menghubungkan berkas stylesheet eksternal -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main>
        
        <!-- Showcase Card dengan Modifier Featured (Unggulan) -->
        <article class="showcase-card showcase-card--featured">
            
            <!-- Video Demonstrasi dengan Fallback Source -->
            <video class="showcase-card__media" controls poster="./unhas_logo.png">
                <source src="assets/videos/demo-tutorial.mp4" type="video/mp4">
                Browser Anda tidak mendukung pemutaran video HTML5 natif. Silakan
                <a href="assets/videos/demo-tutorial.mp4">unduh berkas video ini</a>.
            </video>

            <div class="showcase-card__content">
                <h1 class="showcase-card__title">Video Ajar: Dasar Client-Side Logic</h1>
                <p class="showcase-card__description">
                    Materi video di atas menjelaskan bagaimana browser memproses berkas JavaScript secara asinkronus setelah DOM Tree terbentuk.
                </p>

                <!-- Integrasi Audio Penjelasan -->
                <h2>Dengarkan Penjelasan Audio</h2>
                <audio class="showcase-card__audio-player" controls preload="metadata">
                    <source src="assets/audios/penjelasan-dosen.wav" type="audio/wav">
                    Browser Anda tidak mendukung pemutaran audio HTML5 natif.
                </audio>
            </div>

        </article>

    </main>

</body>
</html>
